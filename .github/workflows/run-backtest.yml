name: BTC Liquidity Sweep Backtest
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of BTC M5 history (0 = all accessible)'
        required: true
        default: '180'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run backtest
        run: python backtest.py --csv btc_m5.csv --out results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: liquidity-sweep-v2-results
         path: |
           results/
           btc_m5.csv
         if-no-files-found: warn
